  <link rel="stylesheet" crossorigin href="/assets/index-oHrOZYqJ.css">

<body>
  <!-- Hero section with background image added inline -->
  <header style="
    background-image: url('/assets/free-travel-background%20-BzUlzjSH.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 80vh;
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    color: white;
  ">
    <!-- Dark overlay -->
    <div style="
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);

    <div style="position: relative; z-index: 2; max-width: 900px; padding: 2rem;">

      <p style="font-size: 1.5rem; margin-bottom: 2rem; text-shadow: 1px 1px 6px rgba(0,0,0,0.7); max-width: 700px; margin-left: auto; margin-right: auto;">
        Discover countries, attractions, and plan your next adventure
      </p>

      <div class="search-container">
        <input type="text" id="search" placeholder="Search country or city..." />
        <button id="searchBtn">Search</button>
      </div>
    </div>
  </header>

  <main>
    <div id="results"></div>
  </main>
